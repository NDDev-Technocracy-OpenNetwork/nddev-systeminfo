[workspace]
members = ["crates/contract", "crates/native", "daemon", "tools"]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-systeminfo"
authors = ["Danil Silantyev, NDDev"]

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.2.0"
thiserror = "=2.0.21"
socket2 = "=0.6.5"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "registry"] }
nddev-systeminfo-contract = { path = "crates/contract", version = "=0.3.2" }
nddev-systeminfo-native = { path = "crates/native", version = "=0.3.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
