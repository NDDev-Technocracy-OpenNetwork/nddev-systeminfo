[workspace]
members = ["crates/contract", "crates/native", "daemon", "tools"]
resolver = "3"

[workspace.package]
version = "0.3.10"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-systeminfo"
authors = ["Danil Silantyev, NDDev"]

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.2.0"
thiserror = "=2.0.21"
socket2 = "=0.6.5"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "registry"] }
sha2 = "=0.11.1"
libc = "=0.2.191"
core-foundation-sys = "=0.8.7"
uds_windows = "=1.2.1"
nvml-wrapper = "=0.13.0"
sysinfo = { version = "=0.40.1", default-features = false, features = ["component", "disk", "network", "system"] }
msi = "=0.11.1"
cfb = "=0.16.0"
nddev-opennetwork-design-tokens = { version = "=0.0.1-alpha.9", git = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-opennetwork-design-system", rev = "dbdf11b27fc6245b7942ad3e271f171602fce931" }
nddev-systeminfo-contract = { path = "crates/contract", version = "=0.3.10" }
nddev-systeminfo-native = { path = "crates/native", version = "=0.3.10", default-features = false }
nddev-systeminfo = { path = "daemon", version = "=0.3.10", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
