[package]
name = "nddev-systeminfo"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Resource-frugal standalone system information for Linux, macOS and Windows"

[[bin]]
name = "nddev-systeminfod"
path = "src/main.rs"

[[bin]]
name = "nddev-systeminfo"
path = "src/bin/nddev-systeminfo.rs"

[[bin]]
name = "nddev-systeminfo-tray"
path = "src/bin/nddev-systeminfo-tray.rs"

[dependencies]
nddev-systeminfo-contract.workspace = true
nddev-systeminfo-native.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
socket2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
nddev-opennetwork-design-tokens.workspace = true

[features]
default = ["nvidia"]
nvidia = ["nddev-systeminfo-native/nvidia"]

[lints]
workspace = true
