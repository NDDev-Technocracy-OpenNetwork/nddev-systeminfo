name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@25f896daa96aeaf14e314e967b1a74614b5c1052
    permissions:
      contents: read
    with:
      setup: true

  lint:
    name: Lint and metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck init-system-helpers
      - run: shellcheck scripts/*.sh install.sh uninstall.sh install-macos.sh uninstall-macos.sh packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm
      - run: ./scripts/check-deb-lifecycle.sh

  daemon:
    name: Daemon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, macos-26-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restores the latest main entry for this OS and architecture on every
      # event; only main saves it, so pull requests never write the cache.
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/hosted-cache@c192c6adcf22088abf456635de614d42e8fa3f8d # nddev-cicd-v0.6.20
        with:
          ecosystems: cargo
      - run: cargo run --locked --package systeminfo-tools -- setup
      - run: ./.tools/bin/systeminfo-tools${{ runner.os == 'Windows' && '.exe' || '' }} test
      - run: cargo clippy --locked --package nddev-systeminfo --all-targets --no-default-features -- -D warnings
      - run: cargo build --release --locked --workspace --all-features
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in "install-windows.ps1", "uninstall-windows.ps1", "scripts/e2e-sample.ps1") {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

  e2e:
    name: End to end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, macos-26-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Windows exercises the socket through .NET instead — CPython does not
      # build AF_UNIX there. Elsewhere a pinned interpreter keeps the venv
      # deterministic.
      - if: runner.os != 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.17'
          # Only one pinned pytest wheel is fetched; a cache would cost more than it saves.
          enable-cache: 'false'
      - run: cargo build --release --locked --package nddev-systeminfo
      - name: Serve and read the protocol (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          ./target/release/nddev-systeminfod &
          daemon_pid=$!
          sleep 1
          PYTHONPATH=python/src uv run --no-project python scripts/e2e-sample.py
          PYTHONPATH=python/src uv run --no-project python scripts/runtime-check.py --socket "${XDG_RUNTIME_DIR}/rldyour-sysinfo.sock"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gjs
          (cd extension && gjs -m tests/smoke.js)
          test_runtime="$(mktemp -d)"
          XDG_RUNTIME_DIR="${test_runtime}" gjs -m extension/tests/client.js
          rmdir "${test_runtime}"
          kill "${daemon_pid}"
      - name: Serve and read the protocol (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          ./target/release/nddev-systeminfod &
          daemon_pid=$!
          sleep 1
          PYTHONPATH=python/src uv run --no-project python scripts/e2e-sample.py
          PYTHONPATH=python/src uv run --no-project python scripts/runtime-check.py --socket "${HOME}/Library/Application Support/rldyour-sysinfo/rldyour-sysinfo.sock"
          swiftc -swift-version 6 -parse-as-library -warnings-as-errors macos/Sample.swift macos/SocketClient.swift macos/tests/SocketTests.swift -o /tmp/sysinfo-socket-tests
          /tmp/sysinfo-socket-tests "${HOME}/Library/Application Support/rldyour-sysinfo/rldyour-sysinfo.sock"
          kill "${daemon_pid}"
      - name: Serve and read the protocol (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $daemon = Start-Process -PassThru -WindowStyle Hidden target/release/nddev-systeminfod.exe
          try {
            Start-Sleep -Seconds 1
            ./scripts/e2e-sample.ps1
          } finally {
            Stop-Process -Id $daemon.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Explain a macOS daemon crash
        if: failure() && runner.os == 'macOS'
        run: |
          python3 - <<'PY_CRASH'
          import json, pathlib
          for path in (pathlib.Path.home() / 'Library/Logs/DiagnosticReports').glob('nddev-systeminfod*.ips'):
              lines = path.read_text().split('\n', 1)
              try:
                  report = json.loads(lines[1])
              except (ValueError, IndexError):
                  continue
              print(json.dumps({key: report.get(key) for key in ('exception', 'termination', 'asi', 'faultingThread')}))
              for thread in report.get('threads', []):
                  if thread.get('triggered'):
                      print(json.dumps(thread.get('frames', [])[:20]))
          PY_CRASH

  platform-clients:
    name: Platform clients (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swiftc -target "$(uname -m)-apple-macosx12.0" -swift-version 6 -parse-as-library -warnings-as-errors -O -framework AppKit macos/*.swift -o /tmp/rldyour-sysinfo-app
      - run: |
          swiftc -swift-version 6 -parse-as-library -warnings-as-errors macos/Sample.swift macos/tests/ProtocolTests.swift -o /tmp/sysinfo-protocol-tests
          /tmp/sysinfo-protocol-tests
      - run: plutil -lint macos/*.plist

  extension:
    name: GNOME extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglib2.0-bin
      - run: ./scripts/check-extension.sh

  python-client:
    name: Python client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.17'
          # Only one pinned pytest wheel is fetched; a cache would cost more than it saves.
          enable-cache: 'false'
      - name: Run the test suite
        shell: bash
        run: PYTHONPATH=python/src uv run --no-project --with pytest==9.1.1 pytest python/tests
      - if: runner.os == 'Linux'
        run: uv build python

  debian-package:
    name: Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y dpkg-dev
      - run: |
          cargo build --release --locked --package nddev-systeminfo
          ./scripts/build-deb.sh target/release/nddev-systeminfod /tmp/sysinfo-deb
          dpkg-deb -x /tmp/sysinfo-deb/*.deb /tmp/sysinfo-unpack
          test "$(stat -c '%a' /tmp/sysinfo-unpack)" = 755
          grep -qx 'ExecStart=/usr/bin/rldyour-sysinfod' /tmp/sysinfo-unpack/usr/lib/systemd/user/rldyour-sysinfod.service
          dpkg-deb -f /tmp/sysinfo-deb/*.deb Depends | grep -q 'libc6'
          /tmp/sysinfo-unpack/usr/bin/rldyour-sysinfod --version
          sudo dpkg -i /tmp/sysinfo-deb/*.deb
          systemctl --global is-enabled rldyour-sysinfod.socket

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@c192c6adcf22088abf456635de614d42e8fa3f8d # nddev-cicd-v0.6.20
        with:
          capability: security
      - name: Lint and audit workflows
        run: |
          actionlint
          zizmor --offline --no-progress .github/workflows/ci.yml .github/dependabot.yml
      - name: Scan new pull request commits, or the full history on main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
          else
            gitleaks git --no-banner --redact .
          fi

