name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@5c97e5eb7e7a95706097e999bb444bf313dfd381 # v0.6.40
    permissions:
      contents: read
    with:
      setup: true

  daemon:
    name: Daemon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, macos-26-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Public runners use their GitHub cache. Trusted dev pushes populate it;
      # PRs only restore, and promotion never rebuilds main to warm a cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.8.2
        with:
          shared-key: systeminfo-native-${{ matrix.os }}
          cache-bin: 'false'
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
      - name: Select verified native Swift
        if: runner.os == 'macOS'
        timeout-minutes: 12
        run: cargo run --locked --package systeminfo-tools -- native-swift
      - name: Record native Apple compiler
        if: runner.os == 'macOS'
        run: swiftc --version
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libglib2.0-bin
      - name: Native installation lifecycle
        # Includes release compilation and native Swift packaging on cold runners.
        timeout-minutes: 8
        run: cargo run --locked --package systeminfo-tools -- install-test
      - name: Real Windows menu acceptance
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: cargo run --locked --package systeminfo-tools -- ui-windows
      - run: cargo run --locked --package systeminfo-tools -- setup
        env:
          GH_TOKEN: ${{ github.token }}
      - run: ./.tools/bin/systeminfo-tools${{ runner.os == 'Windows' && '.exe' || '' }} test
      - run: cargo clippy --locked --package nddev-systeminfo --all-targets --no-default-features -- -D warnings
      - run: cargo build --release --locked --workspace --all-features
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-install-${{ matrix.os }}
          path: .tools/install-acceptance
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Windows'
        with:
          name: win32-native
          path: .tools/ui-windows
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}
          path: dist/nddev-systeminfo-*
          if-no-files-found: error

  platform-clients:
    name: Platform clients (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select verified native Swift
        timeout-minutes: 12
        run: cargo run --locked --package systeminfo-tools -- native-swift
      - name: Record native Apple compiler
        run: swiftc --version
      - run: swiftc -target "$(uname -m)-apple-macosx12.0" -swift-version 6 -no-toolchain-stdlib-rpath -parse-as-library -warnings-as-errors -O -framework AppKit macos/*.swift -o /tmp/nddev-systeminfo-app
      - run: |
          swiftc -swift-version 6 -no-toolchain-stdlib-rpath -parse-as-library -warnings-as-errors macos/Sample.swift macos/Presentation.swift macos/tests/ProtocolTests.swift -o /tmp/sysinfo-protocol-tests
          /tmp/sysinfo-protocol-tests extension/resources/ui.json
      - run: plutil -lint macos/*.plist
      - name: Real AppKit acceptance
        timeout-minutes: 4
        run: |
          cargo build --release --locked --package nddev-systeminfo
          swiftc -target "$(uname -m)-apple-macosx12.0" -swift-version 6 -no-toolchain-stdlib-rpath -parse-as-library -warnings-as-errors -D UI_ACCEPTANCE -framework AppKit macos/*.swift macos/tests/Acceptance.swift -o /tmp/sysinfo-native-acceptance
          ./target/release/nddev-systeminfod &
          provider=$!
          trap 'kill "$provider" 2>/dev/null || true' EXIT
          config="$RUNNER_TEMP/systeminfo-ui.toml"
          ./target/release/nddev-systeminfo --config "$config" config init
          /tmp/sysinfo-native-acceptance --resources extension/resources/ui.json --cli "$PWD/target/release/nddev-systeminfo" --config "$config" --provider-pid "$provider" --artifacts "$RUNNER_TEMP/systeminfo-ui"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: appkit-${{ matrix.os }}
          path: ${{ runner.temp }}/systeminfo-ui
          if-no-files-found: error

  python-client:
    name: Python client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          # Only one pinned pytest wheel is fetched; a cache would cost more than it saves.
          enable-cache: 'false'
      - name: Run the test suite
        shell: bash
        run: PYTHONPATH=python/src uv run --no-project --with pytest==9.2.0 pytest python/tests
      - if: runner.os == 'Linux'
        run: uv build python
      - if: runner.os != 'Windows'
        run: cargo run --locked --package systeminfo-tools -- python-live
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: python-sdk
          path: python/dist/*
          if-no-files-found: error

  debian-package:
    name: Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y dpkg-dev apt-utils libglib2.0-bin init-system-helpers dbus-user-session
      - run: cargo run --locked --package systeminfo-tools -- deb-test
      - name: Real signed APT installation with a disposable key
        run: cargo run --locked --package systeminfo-tools -- apt-fixture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-amd64
          path: dist/*.deb
          if-no-files-found: error

  gnome:
    name: Native GNOME UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gnome-shell gnome-shell-extension-prefs gjs dbus-x11 libglib2.0-bin gir1.2-atspi-2.0 at-spi2-core librsvg2-common libgl1-mesa-dri libegl-mesa0 adwaita-icon-theme fonts-noto-core fonts-noto-cjk
      - name: Native protocol and async client checks
        run: |
          gjs -m extension/tests/protocol.js
          test_runtime="$(mktemp -d)"
          XDG_RUNTIME_DIR="$test_runtime" gjs -m extension/tests/client.js
          rmdir "$test_runtime"
      - name: Actual Shell and GTK acceptance
        run: |
          test_uid="$(id -u)"
          sudo systemctl start "user@$test_uid.service"
          XDG_RUNTIME_DIR="/run/user/$test_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$test_uid/bus" cargo run --locked --package systeminfo-tools -- ui-linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gnome-native
          path: .tools/ui-linux
          if-no-files-found: error

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [check, daemon, platform-clients, python-client, debian-package, gnome]
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      actions: write
    with:
      qualification_run_id: ${{ github.run_id }}
      expected_commit: ${{ github.sha }}
