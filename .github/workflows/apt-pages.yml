name: Publish APT repository
run-name: APT ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified release tag to publish
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the delivery utility without signing credentials
        run: cargo run --locked --package systeminfo-tools -- prepare-delivery
      - name: Download the released packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./.tools/bin/systeminfo-delivery apt-fetch
      - name: Compare with original qualified CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./.tools/bin/systeminfo-delivery verify-deb
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y apt-utils dpkg-dev
      - name: Build signed repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: ./.tools/bin/systeminfo-delivery apt-build
      - name: Verify signed APT installation
        run: ./.tools/bin/systeminfo-delivery apt-test
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy APT repository
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
