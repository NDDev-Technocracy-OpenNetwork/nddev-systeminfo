name: Publish APT repository

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified release tag to publish
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      expected_commit:
        required: true
        type: string
    secrets:
      APT_SIGNING_KEY:
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve an existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release view "${RELEASE_TAG}" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease)' | grep -qx false
          printf 'tag=%s\n' "${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the qualified Debian artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          if [[ -n "${EXPECTED_COMMIT}" ]]; then
            test "$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha)" = "${EXPECTED_COMMIT}"
          fi
          mkdir -p released
          gh release download "${RELEASE_TAG}" --pattern '*_amd64.deb' --pattern SHA256SUMS --dir released
          (cd released && sha256sum --check --ignore-missing SHA256SUMS)
          test "$(find released -name '*.deb' | wc -l)" -eq 1
          test "$(dpkg-deb --field released/*.deb Version)" = "${RELEASE_TAG#v}"
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y apt-utils dpkg-dev
      - name: Build signed repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 022
          mkdir -p site/apt/pool/main/r/rldyour-sysinfo site/apt/dists/stable/main/binary-amd64
          install -m644 released/*.deb site/apt/pool/main/r/rldyour-sysinfo/
          cd site/apt
          dpkg-scanpackages --arch amd64 pool > dists/stable/main/binary-amd64/Packages
          gzip -9 -k dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="NDDev OpenNetwork" \
            -o APT::FTPArchive::Release::Label="rldyour-sysinfo" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            release dists/stable > dists/stable/Release
          printf '%s' "${APT_SIGNING_KEY}" | gpg --batch --import
          gpg --batch --yes --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release
          install -m644 ../../packaging/apt/rldyour-sysinfo.asc rldyour-sysinfo.asc
          # Only public repository content; keep the sandboxed _apt downloader
          # able to traverse and read both compressed and plain indexes.
          chmod -R a+rX .
      - name: Verify APT installation
        run: |
          sudo install -m644 packaging/apt/rldyour-sysinfo.asc /usr/share/keyrings/rldyour-sysinfo.asc
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/rldyour-sysinfo.asc] file:${PWD}/site/apt stable main" | sudo tee /etc/apt/sources.list.d/rldyour-sysinfo.list
          sudo apt-get update
          sudo apt-get install -y rldyour-sysinfo
          test -x /usr/bin/rldyour-sysinfod
          /usr/bin/rldyour-sysinfod --version
          grep -qx 'ExecStart=/usr/bin/rldyour-sysinfod' /usr/lib/systemd/user/rldyour-sysinfod.service
          # The maintainer scripts must have enabled the socket for every
          # login session — the package is useless until it exists.
          systemctl --global is-enabled rldyour-sysinfod.socket
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy APT repository
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
