name: Release

on:
  workflow_call:
    inputs:
      qualification_run_id:
        type: string
        required: true
      expected_commit:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Original dev CI run whose qualified artifacts should be recovered
        type: string
        required: true

permissions: {}

concurrency:
  group: systeminfo-delivery
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: source
        env:
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        with:
          script: |
            const runId = Number(process.env.QUALIFICATION_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) throw new Error('Invalid qualification run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            const repositoryId = Number(process.env.GITHUB_REPOSITORY_ID);
            if (run.event !== 'push' || run.head_branch !== 'dev' ||
                run.path !== '.github/workflows/ci.yml' || run.repository.id !== repositoryId ||
                run.head_repository.id !== repositoryId || !/^[a-f0-9]{40}$/.test(run.head_sha) ||
                (process.env.EXPECTED_COMMIT && process.env.EXPECTED_COMMIT !== run.head_sha)) {
              throw new Error('Qualification is not this repository’s dev push CI');
            }
            // Only this trusted source is ever checked out by the write job.
            core.setOutput('commit', run.head_sha);
            core.setOutput('run_id', String(runId));

  publish:
    name: Publish verified artifacts
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compile the delivery utility without write credentials
        run: cargo run --locked --package systeminfo-tools -- prepare-delivery
      - name: Promote and publish the qualified bytes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ needs.resolve.outputs.run_id }}
          QUALIFICATION_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: ./.tools/bin/systeminfo-delivery publish

  apt:
    name: Publish signed APT
    needs: publish
    if: needs.publish.outputs.latest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.publish.outputs.commit }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_COMMIT;
            if (!/^v\d+\.\d+\.\d+$/.test(tag) || !/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid release identity');
            const start = Date.now() - 1000;
            // Pages accepts only main. workflow_dispatch is the explicit event
            // which a scoped Actions token can trigger after stable promotion.
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'apt-pages.yml', ref: 'main', inputs: {tag}
            });
            let runId;
            for (let attempt = 0; attempt < 120; attempt++) {
              if (!runId) {
                const {data} = await github.rest.actions.listWorkflowRuns({
                  ...context.repo, workflow_id: 'apt-pages.yml', branch: 'main',
                  event: 'workflow_dispatch', per_page: 100
                });
                const matches = data.workflow_runs.filter(run => run.head_sha === sha &&
                  run.display_title === `APT ${tag}` && Date.parse(run.created_at) >= start);
                if (matches.length > 1) throw new Error('Ambiguous APT publication run');
                runId = matches[0]?.id;
              }
              if (runId) {
                const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
                if (run.status === 'completed') {
                  if (run.conclusion !== 'success') throw new Error(`APT publication failed: ${run.html_url}`);
                  core.info(`Signed APT verified: ${run.html_url}`);
                  return;
                }
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('APT publication did not finish within its delivery deadline');
