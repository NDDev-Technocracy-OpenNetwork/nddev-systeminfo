name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Gate everything on the tag matching every published version string,
      # before any runner spends a minute building.
      - run: ./scripts/check-version.sh "${GITHUB_REF_NAME}"

  linux:
    needs: verify
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglib2.0-bin
      - run: ./scripts/check-extension.sh
      - run: cargo test --all-features --locked --manifest-path daemon/Cargo.toml
      - run: cargo build --release --all-features --locked --manifest-path daemon/Cargo.toml
      - name: Package Linux
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/stage/systemd
          install -m755 target/release/nddev-systeminfod dist/stage/rldyour-sysinfod
          install -m644 daemon/systemd/* dist/stage/systemd/
          install -m644 LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md dist/stage/
          tar -czf "dist/rldyour-sysinfo-${version}-x86_64-linux.tar.gz" -C dist/stage .
          cp -r extension dist/extension
          rm -rf dist/extension/tests
          glib-compile-schemas dist/extension/schemas
          (cd dist/extension && zip -qr "../rldyour-sysinfo-gnome-${version}.zip" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/rldyour-sysinfo-*

  macos:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --locked --no-default-features --manifest-path daemon/Cargo.toml
      - run: cargo build --release --locked --no-default-features --manifest-path daemon/Cargo.toml
      - name: Package macOS
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          arch="$(uname -m)"
          app="dist/stage/prebuilt/rldyour-sysinfo.app"
          mkdir -p "${app}/Contents/MacOS" dist/stage/prebuilt dist/stage/macos
          swiftc -target "${arch}-apple-macosx12.0" -swift-version 6 -parse-as-library -O -framework AppKit macos/*.swift -o "${app}/Contents/MacOS/rldyour-sysinfo"
          plutil -create xml1 "${app}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string rldyour-sysinfo' "${app}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.nddev-opennetwork.rldyour-sysinfo' "${app}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleName string rldyour-sysinfo' "${app}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :LSUIElement bool true' "${app}/Contents/Info.plist"
          codesign --force --sign - "${app}"
          install -m755 target/release/nddev-systeminfod dist/stage/prebuilt/
          install -m644 macos/*.plist dist/stage/macos/
          install -m755 install-macos.sh uninstall-macos.sh dist/stage/
          install -m644 LICENSE CHANGELOG.md THIRD_PARTY_NOTICES.md dist/stage/
          printf '%s\n' "${version}" > dist/stage/VERSION
          (cd dist/stage && zip -qry "../rldyour-sysinfo-${version}-${arch}-macos.zip" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.os }}
          path: dist/rldyour-sysinfo-*.zip

  windows:
    needs: verify
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --locked --all-features --manifest-path daemon/Cargo.toml
      - run: cargo build --release --locked --all-features --manifest-path daemon/Cargo.toml
      - name: Package Windows
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item target/release/nddev-systeminfod.exe, install-windows.ps1, uninstall-windows.ps1, LICENSE, CHANGELOG.md, THIRD_PARTY_NOTICES.md dist/stage/
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/rldyour-sysinfo-$version-x86_64-windows.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/rldyour-sysinfo-*.zip

  python:
    needs: verify
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.17'
      - run: uv build python
      - run: uv run --no-project --with twine==7.0.0 twine check python/dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python
          path: python/dist/*

  publish:
    needs: [linux, macos, windows, python]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -- ./* > SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes -- dist/*

  apt:
    needs: publish
    uses: ./.github/workflows/apt-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      tag: ${{ github.ref_name }}
      expected_commit: ${{ github.sha }}
    secrets:
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
