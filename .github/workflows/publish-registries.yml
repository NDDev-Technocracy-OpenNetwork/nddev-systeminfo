name: Publish Python registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing latest stable release tag
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  python:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.17'
          enable-cache: 'false'
      - name: Download the released distribution
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir released --pattern '*.whl' --pattern 'rldyour_sysinfo-*.tar.gz'
      - name: Verify against original qualified CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: cargo run --locked --package systeminfo-tools -- verify-python
      - name: Publish the qualified bytes
        run: uv publish --trusted-publishing always released/*
