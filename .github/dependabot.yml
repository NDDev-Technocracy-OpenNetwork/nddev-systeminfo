version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      # Our own CI library is taken at its latest release: no wait.
      exclude:
        - NDDev-Technocracy-OpenNetwork/nddev-ci*
    # Every call of the library moves in one proposal.
    groups:
      ci-library:
        patterns:
          - NDDev-Technocracy-OpenNetwork/nddev-ci*
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
