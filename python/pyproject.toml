[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "rldyour-sysinfo"
version = "0.3.1"
description = "Python client for the rldyour-sysinfo live metrics daemon"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
authors = [{ name = "NDDev OpenNetwork" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-systeminfo"
Repository = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-systeminfo"
Issues = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-systeminfo/issues"

[project.scripts]
rldyour-sysinfo = "rldyour_sysinfo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rldyour_sysinfo"]
