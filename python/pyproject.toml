[build-system]
build-backend = "hatchling.build"
requires = ["hatchling==1.32.4"]

[project]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: POSIX :: Linux",
]
description = "Dependency-free Python client for NDDev Systeminfo local metrics"
license = "Apache-2.0"
license-files = [
    "LICENSE",
    "NOTICE",
]
name = "rldyour-sysinfo"
readme = "README.md"
requires-python = ">=3.9"
version = "0.3.4"

[[project.authors]]
name = "NDDev OpenNetwork"

[project.scripts]
rldyour-sysinfo = "rldyour_sysinfo:main"

[project.urls]
Homepage = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-systeminfo"
Issues = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-systeminfo/issues"
Repository = "https://github.com/NDDev-Technocracy-OpenNetwork/nddev-systeminfo"

[tool.hatch.build.targets.wheel]
packages = ["src/rldyour_sysinfo"]
