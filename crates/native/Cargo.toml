[package]
name = "nddev-systeminfo-native"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only native OS access for NDDev Systeminfo"

[dependencies]
nddev-systeminfo-contract.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = { version = "0.13.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8.7"

[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["component", "disk", "network", "system"] }
uds_windows = "1.2.1"

[features]
default = ["nvidia"]
nvidia = ["dep:nvml-wrapper"]
ui-acceptance = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
